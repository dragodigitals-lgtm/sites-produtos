<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.38),rgba(37,99,235,0) 65%);top:-250px;right:-450px}
.glow2{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.09),rgba(0,0,0,0) 65%);bottom:200px;left:-400px}
.logo{position:absolute;top:120px;left:90px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:46px}
.logo i{width:26px;height:26px;background:#2563eb;border-radius:4px}
.s{position:absolute;left:90px;right:90px;top:360px}
.e{font-family:'DejaVu Sans Mono',monospace;font-size:30px;letter-spacing:5px;color:#7aa2ff;margin-bottom:34px}
h1{font-size:98px;line-height:1.03;letter-spacing:-5px;font-weight:600}
h1 span{color:#7aa2ff}
.cards{margin-top:64px;display:flex;flex-direction:column;gap:22px}
.c{border:1px solid #2a2e38;background:#12141a;border-radius:22px;padding:28px 32px;display:flex;align-items:center;gap:28px}
.th{width:120px;height:120px;border-radius:14px;background:linear-gradient(135deg,#1e3a8a,#2563eb 50%,#7aa2ff);filter:blur(6px);opacity:.75;flex:none}
.l{flex:1;display:flex;flex-direction:column;gap:16px}
.bar{height:22px;border-radius:11px;background:#262a35}
.bar.s2{width:60%;background:#1d2029}
.tag{font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:3px;font-weight:700;padding:8px 14px;border-radius:6px}
.free{background:#bef264;color:#0a0b0f}
.lock{color:#6b7280;border:1px solid #2a2e38}
.foot{margin-top:56px;display:flex;align-items:center;gap:28px}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:42px;padding:26px 42px;border-radius:18px}
.small{font-size:34px;color:#9ca3af}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="logo"><i></i>wwwswipe</div>
<div class="s"><div class="e">UPDATED TODAY</div>
<h1>Today's free picks<br><span>are live.</span></h1>
<div class="cards">
<div class="c"><div class="th"></div><div class="l"><div class="bar"></div><div class="bar s2"></div></div><div class="tag free">FREE</div></div>
<div class="c"><div class="th" style="filter:blur(9px)"></div><div class="l"><div class="bar"></div><div class="bar s2"></div></div><div class="tag free">FREE</div></div>
<div class="c"><div class="th" style="filter:blur(12px);opacity:.5"></div><div class="l"><div class="bar"></div><div class="bar s2"></div></div><div class="tag lock">MEMBERS</div></div>
</div>
<div class="foot"><div class="cta">Unlock free → wwwswipe.com</div></div>
</div>
</body></html>
