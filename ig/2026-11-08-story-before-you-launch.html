<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.38),rgba(37,99,235,0) 65%);top:-250px;right:-450px}

.logo{position:absolute;top:120px;left:90px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:46px}

.s{position:absolute;left:90px;right:90px;top:400px}
.e{font-family:'DejaVu Sans Mono',monospace;font-size:30px;letter-spacing:5px;color:#7aa2ff;margin-bottom:34px}

h1 span{color:#7aa2ff}
.opts{margin-top:70px;display:flex;flex-direction:column;gap:22px}
.o{border:1px solid #2a2e38;border-radius:20px;padding:34px 40px;font-size:44px;font-weight:600;color:#e5e7eb;background:#0f1117;display:flex;align-items:center;gap:26px}
.o i{font-style:normal;font-family:'DejaVu Sans Mono',monospace;font-size:30px;color:#7aa2ff}
.o.on{border-color:#2f3a55;background:#12141a;box-shadow:0 0 60px rgba(37,99,235,.25)}
.o.on i{color:#bef264}
.foot{margin-top:60px}
.cta{display:inline-block;background:#2563eb;color:#fff;font-weight:600;font-size:42px;padding:26px 42px;border-radius:18px}
</style></head><body><div class="glow"></div><div class="glow2"></div>
