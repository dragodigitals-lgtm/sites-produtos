<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.36),rgba(37,99,235,0) 65%);top:-300px;right:-360px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.09),rgba(0,0,0,0) 65%);bottom:-280px;left:-260px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.eyebrow{margin-top:84px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:100px;line-height:1.03;letter-spacing:-4px;font-weight:600}
h1 span{color:#7aa2ff}
.log{margin-top:80px;border:1px solid #23262f;background:#111318;border-radius:22px;padding:44px 40px;display:flex;flex-direction:column;gap:36px}
.r{display:flex;align-items:center;gap:22px;font-family:'DejaVu Sans Mono',monospace;font-size:22px;letter-spacing:2px;color:#4b5563}
.r .tr{flex:1;height:20px;border-radius:7px;background:#15171d;position:relative;overflow:hidden}.r .ln{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#2a2e39}
.r .x{width:150px;text-align:right}
.r.on{color:#f4f5f7}
.r.on .ln{width:100%;background:linear-gradient(90deg,#2563eb,#7aa2ff);box-shadow:0 0 28px rgba(37,99,235,.55)}
.r.on .x span{background:#bef264;color:#0a0b0f;padding:5px 10px;border-radius:5px;font-weight:700}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:34px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
<div class="logo"><i></i>wwwswipe</div>
<div class="eyebrow">The expensive part is done</div>
<h1>Someone already<br>paid for the tests.<br><span>You get the winner.</span></h1>
<div class="log">
 <div class="r"><span>TEST</span><div class="tr"><div class="ln" style="width:62%"></div></div><div class="x">CUT</div></div>
 <div class="r"><span>TEST</span><div class="tr"><div class="ln" style="width:40%"></div></div><div class="x">CUT</div></div>
 <div class="r"><span>TEST</span><div class="tr"><div class="ln" style="width:52%"></div></div><div class="x">CUT</div></div>
 <div class="r on"><span>TEST</span><div class="tr"><div class="ln"></div></div><div class="x"><span>SCALING</span></div></div>
</div>
<div class="bottom"><div class="sub">Model what survived.<br><b>Free picks every day.</b></div><div class="cta">wwwswipe.com</div></div>
</div></body></html>
