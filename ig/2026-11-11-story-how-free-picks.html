<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.38),rgba(37,99,235,0) 65%);top:300px;left:-500px}
.glow2{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.08),rgba(0,0,0,0) 65%);top:-200px;right:-350px}
.logo{position:absolute;top:120px;left:90px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:46px}
.logo i{width:26px;height:26px;background:#2563eb;border-radius:4px}
.s{position:absolute;left:90px;right:90px;top:430px}
.e{font-family:'DejaVu Sans Mono',monospace;font-size:30px;letter-spacing:5px;color:#7aa2ff;margin-bottom:34px}
.e b{background:#bef264;color:#0a0b0f;padding:4px 12px;border-radius:5px;margin-right:16px}
h1{font-size:132px;line-height:1.02;letter-spacing:-6px;font-weight:600}
h1 span{color:#7aa2ff}
p{margin-top:50px;font-size:46px;line-height:1.35;color:#9ca3af;max-width:820px}
.row{margin-top:70px;display:flex;gap:24px}
.chip{border:1px solid #2f3a55;background:#12141a;border-radius:20px;padding:28px 34px;font-size:40px;font-weight:600}
.chip.x{color:#6b7280;text-decoration:line-through}
.chip.v{color:#bef264;box-shadow:0 0 60px rgba(37,99,235,.25)}
.cta{display:inline-block;margin-top:70px;background:#2563eb;color:#fff;font-weight:600;font-size:42px;padding:26px 42px;border-radius:18px}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="logo"><i></i>wwwswipe</div>
<div class="s"><div class="e"><b>NEW POST</b>SWIPE ↓</div>
<h1>Free offers.<br><span>Every day.</span><br>Here's how.</h1>
<p>Validated offers running live ads — some unlocked for everyone, daily.</p>
<div class="row"><div class="chip">Open</div><div class="chip">Study</div><div class="chip v">✓ Build</div></div>
<div class="cta">See today's picks → wwwswipe.com</div>
</div></body></html>
