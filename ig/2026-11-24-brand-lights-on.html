<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.30),rgba(37,99,235,0) 65%);top:-340px;left:-380px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.eyebrow{margin-top:80px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:100px;line-height:1.03;letter-spacing:-4px;font-weight:600}
h1 span{color:#7aa2ff}
.grid{margin-top:64px;position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;padding:30px;border:1px solid #1c1f27;border-radius:22px;background:#0d0f14;overflow:hidden}
.grid .c{height:96px;border-radius:12px;background:#12141a;border:1px solid #1a1d24;opacity:.55}
.grid .c.on{opacity:1;background:#141a2b;border-color:#2563eb;box-shadow:0 0 50px rgba(37,99,235,.55);position:relative}
.grid .c.on:after{content:"";position:absolute;left:16px;right:30px;top:24px;height:10px;border-radius:5px;background:#7aa2ff;box-shadow:0 22px 0 -1px #2b3550,0 44px 0 -1px #2b3550}
.beam{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(circle at 70% 50%,rgba(122,162,255,.16),rgba(0,0,0,0) 32%);pointer-events:none}
.tag{position:absolute;right:46px;top:-1px;font-family:'DejaVu Sans Mono',monospace;font-size:20px;font-weight:700;letter-spacing:2px;background:#bef264;color:#0a0b0f;padding:7px 14px;border-radius:0 0 6px 6px}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:34px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="glow"></div>
<div class="wrap">
<div class="logo"><i></i>wwwswipe</div>
<div class="eyebrow">Guessing is expensive</div>
<h1>Stop launching<br>in the dark.<br><span>Turn the lights on.</span></h1>
<div class="grid"><div class="beam"></div><div class="tag">SCALING NOW</div>
<div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
<div class="c"></div><div class="c"></div><div class="c"></div><div class="c on"></div><div class="c"></div>
<div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div>
</div>
<div class="bottom"><div class="sub">See what's already working.<br><b>Free picks every day.</b></div><div class="cta">wwwswipe.com</div></div>
</div></body></html>
