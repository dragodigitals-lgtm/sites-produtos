<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:950px;height:950px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.36),rgba(37,99,235,0) 65%);top:-280px;left:-320px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.10),rgba(0,0,0,0) 65%);bottom:-260px;right:-240px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.eyebrow{margin-top:90px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:104px;line-height:1.03;letter-spacing:-4px;font-weight:600}
h1 span{color:#7aa2ff}
.board{margin-top:80px;border:1px solid #23262f;background:#111318;border-radius:22px;padding:44px 36px;display:flex;flex-direction:column;gap:38px}
.r{display:flex;align-items:center;gap:22px}
.nm{width:210px;height:26px;border-radius:6px;background:linear-gradient(90deg,#2a2e39,#1c1f27);filter:blur(1.5px)}
.bar{flex:1;height:22px;border-radius:9px;background:#1a1d24;position:relative;overflow:hidden}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:#2f3a55}
.r.on .bar b{background:linear-gradient(90deg,#2563eb,#7aa2ff);box-shadow:0 0 30px rgba(37,99,235,.6)}
.tag{width:170px;text-align:right;font-family:'DejaVu Sans Mono',monospace;font-size:19px;letter-spacing:2px;color:#6b7280}
.r.on .tag span{background:#bef264;color:#0a0b0f;padding:5px 10px;border-radius:5px;font-weight:700}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:34px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
<div class="logo"><i></i>wwwswipe</div>
<div class="eyebrow">Ads don't lie</div>
<h1>The market<br>already voted.<br><span>See who won.</span></h1>
<div class="board">
 <div class="r on"><div class="nm"></div><div class="bar"><b style="width:94%"></b></div><div class="tag"><span>SCALING</span></div></div>
 <div class="r"><div class="nm"></div><div class="bar"><b style="width:38%"></b></div><div class="tag">TESTING</div></div>
 <div class="r"><div class="nm"></div><div class="bar"><b style="width:12%"></b></div><div class="tag">FADING</div></div>
</div>
<div class="bottom"><div class="sub">Only offers backed by live ads.<br><b>Free picks every day.</b></div><div class="cta">wwwswipe.com</div></div>
</div></body></html>
