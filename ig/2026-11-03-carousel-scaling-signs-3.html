<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.35),rgba(37,99,235,0) 65%);top:-260px;right:-300px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.12),rgba(0,0,0,0) 65%);bottom:-250px;left:-250px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.pg{font-family:'DejaVu Sans Mono',monospace;font-size:24px;color:#6b7280;letter-spacing:3px}
.eyebrow{margin-top:150px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:112px;line-height:1.02;letter-spacing:-4px;font-weight:600}
h2{margin-top:28px;font-size:88px;line-height:1.04;letter-spacing:-3px;font-weight:600}
h1 span,h2 span{color:#7aa2ff}
.num{margin-top:130px;font-family:'DejaVu Sans Mono',monospace;font-size:180px;color:#1f2a44;font-weight:700;line-height:1}
p.body{margin-top:44px;font-size:38px;line-height:1.4;color:#a1a7b3;max-width:860px}
p.body b{color:#f4f5f7;font-weight:600}
.badge{display:inline-block;font-family:'DejaVu Sans Mono',monospace;font-size:22px;background:#bef264;color:#0a0b0f;padding:6px 12px;border-radius:5px;font-weight:700}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:32px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
.swipe{font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:3px;color:#7aa2ff}
</style></head><body><div class="glow"></div><div class="glow2"></div><div class="wrap">
<div class="top"><div class="logo"><i></i>wwwswipe</div><div class="pg">3 / 5</div></div><div class="num">02</div>
<h2>Weeks live.<br><span>Not days.</span></h2>
<p class="body">Nobody keeps paying for ads that lose money. <b>Ads that stay on for weeks</b> are ads that are paying back.</p>
<div class="bottom"><div class="swipe">NEXT →</div></div></div></body></html>
