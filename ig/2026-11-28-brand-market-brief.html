<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.30),rgba(37,99,235,0) 65%);top:380px;right:-520px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.eyebrow{margin-top:80px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:100px;line-height:1.03;letter-spacing:-4px;font-weight:600}
h1 span{color:#7aa2ff}
.doc{margin-top:72px;position:relative;border:1px solid #1c1f27;border-radius:22px;background:#0d0f14;padding:56px 48px;overflow:hidden}
.doc .hd{font-family:'DejaVu Sans Mono',monospace;font-size:20px;letter-spacing:3px;color:#5d6472;margin-bottom:44px}
.row{display:flex;align-items:center;gap:20px;margin-bottom:40px}
.row .k{font-family:'DejaVu Sans Mono',monospace;font-size:21px;letter-spacing:2px;color:#7aa2ff;width:150px}
.row .b{height:14px;border-radius:7px;background:#2a2e38}
.row.on .b{background:#7aa2ff;box-shadow:0 0 30px rgba(122,162,255,.5)}
.row:last-child{margin-bottom:0}
.tag{position:absolute;right:46px;top:-1px;font-family:'DejaVu Sans Mono',monospace;font-size:20px;font-weight:700;letter-spacing:2px;background:#bef264;color:#0a0b0f;padding:7px 14px;border-radius:0 0 6px 6px}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:34px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="glow"></div>
<div class="wrap">
<div class="logo"><i></i>wwwswipe</div>
<div class="eyebrow">Before you build anything</div>
<h1>The market already<br>wrote <span>your brief.</span></h1>
<div class="doc"><div class="tag">FROM LIVE ADS</div><div class="hd">OFFER BRIEF · DRAFT 0</div>
<div class="row"><div class="k">NICHE</div><div class="b" style="width:46%"></div></div>
<div class="row on"><div class="k">FORMAT</div><div class="b" style="width:34%"></div></div>
<div class="row"><div class="k">PROMISE</div><div class="b" style="width:62%"></div></div>
<div class="row on"><div class="k">ANGLE</div><div class="b" style="width:52%"></div></div>
<div class="row"><div class="k">PROOF</div><div class="b" style="width:40%"></div></div>
</div>
<div class="bottom"><div class="sub">Read it before you write a word.<br><b>Free picks every day.</b></div><div class="cta">wwwswipe.com</div></div>
</div></body></html>
