<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.36),rgba(37,99,235,0) 65%);top:-300px;right:-360px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.09),rgba(0,0,0,0) 65%);bottom:-280px;left:-260px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.eyebrow{margin-top:84px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:104px;line-height:1.03;letter-spacing:-4px;font-weight:600}
h1 span{color:#7aa2ff}
.map{margin-top:70px;height:330px;border:1px solid #23262f;background:#111318;border-radius:22px;position:relative;overflow:hidden;
 background-image:linear-gradient(#171a21 1px,transparent 1px),linear-gradient(90deg,#171a21 1px,transparent 1px);background-size:56px 56px}
.map svg{position:absolute;inset:0}
.pin{position:absolute;right:56px;top:24px;font-family:'DejaVu Sans Mono',monospace;font-size:22px;font-weight:700;letter-spacing:2px;background:#bef264;color:#0a0b0f;padding:7px 14px;border-radius:6px}
.lbl{position:absolute;left:40px;top:34px;font-family:'DejaVu Sans Mono',monospace;font-size:20px;letter-spacing:3px;color:#4b5563}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:34px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
<div class="logo"><i></i>wwwswipe</div>
<div class="eyebrow">The signal is public</div>
<h1>Winning offers<br>leave a trail.<br><span>Follow it.</span></h1>
<div class="map">
<svg width="904" height="330" viewBox="0 0 904 330">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".15"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient>
<filter id="b"><feGaussianBlur stdDeviation="6"/></filter></defs>
<path d="M60 270 C 180 260, 200 170, 320 190 S 470 250, 560 170 S 700 90, 780 105" fill="none" stroke="url(#g)" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>
<g fill="#2a2e39"><circle cx="60" cy="270" r="9"/><circle cx="190" cy="232" r="9"/><circle cx="320" cy="190" r="10"/><circle cx="450" cy="222" r="10"/><circle cx="560" cy="170" r="11"/><circle cx="680" cy="118" r="12"/></g>
<g fill="#7aa2ff" opacity=".9"><circle cx="560" cy="170" r="6"/><circle cx="680" cy="118" r="7"/></g>
<circle cx="780" cy="105" r="30" fill="#2563eb" opacity=".55" filter="url(#b)"/>
<circle cx="780" cy="105" r="15" fill="#7aa2ff"/>
</svg>
<div class="pin">SCALING</div>
<div class="lbl">LIVE ADS · WORLDWIDE</div>
</div>
<div class="bottom"><div class="sub">We follow it for you.<br><b>Free picks every day.</b></div><div class="cta">wwwswipe.com</div></div>
</div></body></html>
