<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0a0b0f;font-family:'Inter',sans-serif;color:#f4f5f7;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.35),rgba(37,99,235,0) 65%);top:-260px;right:-300px}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(190,242,100,.12),rgba(0,0,0,0) 65%);bottom:-250px;left:-250px}
.wrap{position:relative;padding:96px 88px;height:100%;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px;letter-spacing:-1px}
.logo i{width:22px;height:22px;background:#2563eb;display:inline-block;border-radius:3px}
.eyebrow{margin-top:110px;font-family:'DejaVu Sans Mono',monospace;font-size:24px;letter-spacing:4px;color:#7aa2ff;text-transform:uppercase}
h1{margin-top:28px;font-size:100px;line-height:1.03;letter-spacing:-4px;font-weight:600}
h1 span{color:#7aa2ff}
.row{margin-top:72px;display:flex;gap:22px;align-items:stretch}
.col{flex:1}
.lab{font-family:'DejaVu Sans Mono',monospace;font-size:19px;letter-spacing:3px;color:#6b7280;margin-bottom:16px}
.lab.on{color:#bef264}
.g{height:300px;border:2px dashed #2a2e38;border-radius:18px;display:flex;flex-wrap:wrap;gap:14px;padding:22px;align-content:flex-start}
.g div{width:calc(50% - 7px);height:118px;border-radius:12px;background:#111318;border:1px solid #1d2028;display:flex;align-items:center;justify-content:center;font-size:44px;color:#3a3f4b;font-weight:600}
.m{height:300px;border:1px solid #2f3a55;border-radius:18px;background:#12141a;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(37,99,235,.25)}
.m .img{height:170px;background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#7aa2ff);filter:blur(12px);transform:scale(1.2)}
.m .badge{position:absolute;z-index:3;top:16px;left:16px;font-family:'DejaVu Sans Mono',monospace;font-size:16px;background:#bef264;color:#0a0b0f;padding:4px 10px;border-radius:4px;font-weight:700}
.m .l{margin:20px 20px 0;height:14px;background:#2a2e38;border-radius:7px}
.bars{position:absolute;right:20px;bottom:22px;display:flex;gap:6px;align-items:flex-end}
.bars i{width:12px;background:#7aa2ff;border-radius:3px}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.sub{font-size:34px;color:#a1a7b3;line-height:1.35}
.sub b{color:#f4f5f7;font-weight:600}
.cta{background:#2563eb;color:#fff;font-weight:600;font-size:30px;padding:22px 34px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="glow"></div><div class="glow2"></div>
<div class="wrap">
<div class="logo"><i></i>wwwswipe</div>
<div class="eyebrow">Guessing vs. modeling</div>
<h1>Stop guessing.<br>Model what's<br><span>already scaling.</span></h1>
<div class="row">
 <div class="col"><div class="lab">GUESSING</div><div class="g"><div>?</div><div>?</div><div>?</div><div>?</div></div></div>
 <div class="col"><div class="lab on">MODELING ●</div><div class="m"><div class="badge">SCALING</div><div class="img"></div><div class="l" style="width:62%"></div><div class="l" style="width:40%;margin-top:12px"></div><div class="bars"><i style="height:22px"></i><i style="height:36px"></i><i style="height:52px"></i><i style="height:70px"></i></div></div></div>
</div>
<div class="bottom"><div class="sub">Validated offers, curated daily.<br><b>Free picks every day.</b></div><div class="cta">wwwswipe.com</div></div>
</div></body></html>
